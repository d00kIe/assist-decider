name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  integration-zip:
    name: Attach integration zip for HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stamp version from the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          python3 - "$version" <<'PY'
          import json, sys
          path = "custom_components/assist_decider/manifest.json"
          manifest = json.load(open(path))
          manifest["version"] = sys.argv[1]
          json.dump(manifest, open(path, "w"), indent=2)
          PY
      - name: Zip
        run: cd custom_components/assist_decider && zip -r ../../assist_decider.zip . -x '__pycache__/*'
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: assist_decider.zip
