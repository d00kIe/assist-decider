# Assist Decider server configuration.
# Copy to assist-decider.toml (git-ignored).
# Start with: assist-decider --config assist-decider.toml
# (or set ASSIST_DECIDER_CONFIG=/path/to/assist-decider.toml). The file is not read otherwise.
# Every setting can also be given as an environment variable ASSIST_DECIDER_<NAME>
# (e.g. ASSIST_DECIDER_PORT) or on the command line (--host, --port, --model, ...).
# Precedence: defaults < this file < environment < command line.

# Address to listen on. 127.0.0.1 = this machine only. Use 0.0.0.0 so Home Assistant
# on another machine can connect. There is no authentication: closed home network only.
host = "127.0.0.1"
port = 8765

# Decision model kept in memory (see BENCHMARK.md). Memory in use, and the confidence
# threshold to set in Home Assistant for it:
#   "multilingual"          Laya, English + German, ~1.2 GB, threshold 0.4
#   "english"               Laya, English only, ~2.0 GB, threshold 0.2
#   "kev-0.8b"              English + German, ~2.3 GB, threshold 0.4
#   "intern-decision-0.8b"  English + German, ~2.3 GB, threshold 0.2 (recommended)
#   "intern-decision-2b"    English + German, ~4.6 GB, threshold 0.2
#   "h2o-lightning-4b"      English + German, ~8.8 GB, threshold 0.1
model = "multilingual"

# auto picks cuda, then mps (Apple Silicon), then xpu, then cpu.
device = "auto"

# Requests waiting for the model beyond this get HTTP 503.
max_pending = 4
# Largest accepted request body in bytes.
max_body_bytes = 1048576
# Log lines and decisions kept in memory for the web UI.
log_buffer = 2000
log_level = "INFO"

# Optional TLS. Both must be set together.
# tls_certfile = "/path/to/cert.pem"
# tls_keyfile = "/path/to/key.pem"
