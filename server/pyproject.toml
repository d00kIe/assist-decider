[project]
name = "assist-decider"
version = "0.1.0"
description = "Remote decision server for Home Assistant Assist, powered by the Laya decision model"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "d00kIe" }]
dependencies = [
    "laya==0.3.26",
    "fastapi>=0.135",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "unicode-rbnf>=2.3,<3",
]

[project.scripts]
assist-decider = "assist_decider_server.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assist_decider_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads the real Laya model (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]
